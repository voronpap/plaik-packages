<!doctype html>
<html lang="{{ locale }}" data-web-theme="auto-parts">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="{{ theme_strings.meta_description }}">
    <title>{{ page.title }}</title>
    {{ theme_assets("css") }}
    {{ hook("displayHeader") }}
  </head>
  <body class="plk-auto-parts">
    <a class="plaik-skip-link" href="#main-content">{{ theme_strings.skip_to_content }}</a>
    {{ composition }}
    {{ slot("storefront.seo.structured-data") }}
    {{ hook("displayContent") }}{{ hook("displayFooter") }}
  </body>
</html>
