<section class="plk-product-grid" aria-label="Products" data-plaik-package="catalog">
  {% if storefront and "items" in storefront and storefront["items"] %}
    {% for product in storefront["items"] %}
      <article class="plk-product-card">
        <p class="plk-product-card__sku">{{ product.sku }}</p>
        <h2><a href="/product/{{ product.id }}">{{ product.title }}</a></h2>
      </article>
    {% endfor %}
  {% else %}
    <p data-plaik-products>No published products yet.</p>
  {% endif %}
</section>
